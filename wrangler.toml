# Cloudflare Workers config — non-secret defaults.
# nitro reads this and generates the final dist/server/wrangler.json at build time,
# overriding `main` and `assets` paths. Deploy from dist/server/ after build:
#
#   bun run build
#   bunx wrangler deploy --config dist/server/wrangler.json --cwd dist/server
#
# Set secrets via Dashboard or:
#   bunx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   bunx wrangler secret put ZEPTOMAIL_API_KEY
#   bunx wrangler secret put NEWAPI_ADMIN_TOKEN
#   bunx wrangler secret put SESSION_SECRET
#   bunx wrangler secret put LOVABLE_API_KEY

name = "novarelay"
main = "dist/server/server.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "dist/client"
binding = "ASSETS"

